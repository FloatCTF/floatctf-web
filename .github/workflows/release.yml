name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "发布 Tag（例如 v1.0.0）"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Node + npm（官方原生，最稳组合）
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 确保这里指向的是 package-lock.json
          cache-dependency-path: frontend/package-lock.json

      # =========================
      # install & build
      # =========================
      - name: Install dependencies
        # 使用 npm ci 替代 npm install，能严格按照 lock 文件安装，速度更快且更稳定
        run: npm ci

      - name: Build frontend
        run: npm run build

      # =========================
      # package
      # =========================
      - name: Archive frontend
        run: |
          cd dist
          tar -czf ../../html.tar.gz .

      # =========================
      # release
      # =========================
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: html.tar.gz
