name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "发布 Tag（例如 v1.0.0）"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 核心修复点：使用官方 Action 安装 pnpm，弃用坑人的 corepack
      # =========================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # 明确指定 pnpm 版本，稳定可靠
          run_install: false

      # =========================
      # 配置 Node，并让它使用刚刚安装好的 pnpm 进行缓存
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml

      # =========================
      # install & build
      # =========================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      # =========================
      # package
      # =========================
      - name: Archive frontend
        run: |
          cd dist
          tar -czf ../../html.tar.gz .

      # =========================
      # release
      # =========================
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: html.tar.gz
