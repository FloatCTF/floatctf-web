name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "发布 Tag（例如 v1.0.0）"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 保持你原来的设定，让 run 命令默认在 frontend 目录执行
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 使用官方 Action 安装 pnpm（最稳妥，绕过 corepack bug）
      # =========================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # =========================
      # 配置 Node.js 并使用根目录的锁文件进行缓存
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # 明确指向根目录的锁文件，完美解决找不到路径的报错
          cache-dependency-path: pnpm-lock.yaml

      # =========================
      # install & build
      # =========================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      # =========================
      # package
      # =========================
      - name: Archive frontend
        run: |
          cd dist
          tar -czf ../../html.tar.gz .

      # =========================
      # release
      # =========================
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: html.tar.gz
